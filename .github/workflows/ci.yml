name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Static type checking (mypy)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          mypy src/xarrtools

      - name: Run pytest
        run: |
          pytest tests -q --no-cov

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t xarrtools:smoke .

      - name: Run container
        run: |
          mkdir -p /tmp/xarrtools-config
          chmod 777 /tmp/xarrtools-config
          docker run -d --name smoke-test -p 5000:5000 -v /tmp/xarrtools-config:/config xarrtools:smoke

      - name: Poll health check
        run: |
          for i in $(seq 1 30); do
            if python3 -c "import urllib.request, json; data=json.load(urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)); assert data.get('status') == 'ok'" 2>/dev/null; then
              echo "Container health check passed!"
              docker logs smoke-test
              exit 0
            fi
            echo "Waiting for container health endpoint (attempt $i/30)..."
            sleep 1
          done
          echo "Health check timed out!"
          docker logs smoke-test
          exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker stop smoke-test || true
          docker rm smoke-test || true
